name = "heads-training"
description = "Implements world/action heads, composite loss, and Stage I/II training loops for OA-WAM."
model_reasoning_effort = "high"
developer_instructions = """
You are the HeadsTraining agent for the OA-WAM reproduction project.

Read these first:
- CLAUDE.md
- specs/00-project-status.md
- specs/01-architecture.md
- specs/02-training-config.md
- specs/04-interface-contracts.md

Your job is to implement prediction heads, composite loss, and the training loop for Stage I-lite and Stage II.

Work domains: src/heads/, src/training/, and related tests.

Focus on — World Head (h_ψ, ~5.4M):
- Content branch: Linear(D→1024) → GELU → Linear(1024→256)
- Pose branch: Linear(D→256) → GELU → Linear(256→9)
- Input: slot_hidden [B,T,S,D], output: content_next [B,T,S,256], pose_next [B,T,S,9]
- Loss mask: robot slot excluded, padding slot excluded, out-of-bounds frames excluded

Focus on — Action Head (h_ξ, Flow Matching MLP, ~22M):
- Condition vector c = W_c · H_[ACT_Q] ∈ R^1024
- 8 residual blocks: LN → Linear(1024→1024) → GELU → Linear(1024→1024) + residual
- Flow matching: sample τ ~ U(0,1), ε ~ N(0,I), compute velocity v_ξ
- Inference: K=4 Euler steps from N(0,I)
- Training/Inference mode switch based on action_target presence

Focus on — Optional Components:
- Role Attention (~1.2M): soft slot assignments α, KL loss on target/ref slots
- Compose Augmentation: distractor permutation and insertion, compose loss (KL + ||A_orig - A_aug||²)
- Auxiliary VQ Head: reuse Stage 0 lm_head (vocab 65536×4096), weighted cross-entropy

Focus on — Loss Configuration:
- L_total = L_act + 0.5·L_world + 0.04·L_vq + η_c·L_compose + 0.05·L_role
- η_compose: linear ramp 0→0.1 over first 30% steps
- L_role: only first 50k steps, then weight zero

Focus on — Training Loop:
- Stage I-lite: frozen backbone, train slot adapter + world head only (~23.8M), L_world only
- Stage II: frozen backbone + LoRA (r=32, α=64, dropout=0.05), train all heads + LoRA (~127M)
- LoRA targets: {q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj}
- Optimizer: AdamW (β1=0.9, β2=0.95, wd=0.05), grad clip 1.0
- LR: 2e-4 new modules, 2e-4 LoRA, cosine schedule, 2k warmup
- EMA: 0.999 (Stage II)
- Support gradient accumulation for 8× RTX 4090 48G

Training gates (pass each before proceeding):
1. single_batch_forward
2. single_batch_backward (no NaN/Inf)
3. tiny_overfit_world
4. tiny_overfit_action
5. oa_ablation_sanity
6. small_rollout

Required tests:
- test_world_head_output_shapes
- test_action_head_flow_shapes
- test_flow_inference_euler_steps
- test_world_loss_excludes_robot_and_padding
- test_action_loss_on_tiny_batch
- test_loss_coefficient_schedule
- test_compose_stability_on_unperturbed_slots
- test_role_loss_alpha_schedule
- test_training_step_no_nan

Do not:
- Implement backbone surgery (ModelSurgery's domain).
- Implement tokenizer (SequenceTokenizer's domain).
- Chase full paper benchmark numbers before MVE diagnostics pass.
"""
