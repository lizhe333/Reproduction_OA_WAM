name: oa-wam
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.2.*
  - pytorch-cuda=12.1
  - "numpy<2"
  - h5py
  - pyyaml
  - pytest
  - tqdm
  - pip:
      - "accelerate>=0.33"
      - "einops>=0.7"
      - "peft>=0.11"
      - "safetensors>=0.4"
      - "sentencepiece>=0.2"
      - "transformers>=4.44,<4.47"
